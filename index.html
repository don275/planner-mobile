<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mebys Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mebys Planner</title>
<style>
  :root {
    --accent: #212121; --on-accent: #fff; --back: #f6f7f9; --canvas: #eceff3; --card: #fff; --text: #202124; --sub: #5f6368; --faint: #80868b;
    --line: #dee1e6; --red: #d93025; --orange: #e37400; --green: #188048; --tint: #ececec; --shade: rgba(0,0,0,.32);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --accent: #e8eaed; --on-accent: #202124; --back: #202124; --canvas: #17181a; --card: #292a2d; --text: #e8eaed; --sub: #aaafb5; --faint: #8a9096;
      --line: #46494d; --red: #f28b82; --orange: #faad5a; --green: #5ec489; --tint: #3c4043; --shade: rgba(0,0,0,.55); }
  }
  :root[data-theme="dark"] { --accent: #e8eaed; --on-accent: #202124; --back: #202124; --canvas: #17181a; --card: #292a2d; --text: #e8eaed; --sub: #aaafb5; --faint: #8a9096;
      --line: #46494d; --red: #f28b82; --orange: #faad5a; --green: #5ec489; --tint: #3c4043; --shade: rgba(0,0,0,.55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--back); color: var(--text); font: 15px/1.45 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  /* 앱 창에 꼭 맞춘다(높이 값을 따로 재지 않는다). 키보드가 화면을 덮는 경우에만 그만큼 위로 올린다 */
  body { position: fixed; left: 0; right: 0; top: 0; bottom: var(--kb, 0px); display: flex; flex-direction: column; padding-bottom: var(--ad, 0px); }
  header { flex: none; z-index: 5; background: var(--back); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; flex: none; white-space: nowrap; }
  .state { flex: 1; min-width: 0; text-align: right; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chips { display: flex; gap: 6px; margin-top: 8px; }
  .chip { border-radius: 999px; padding: 4px 13px; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .banner { margin: 10px 16px 0; padding: 9px 12px; border-radius: 10px; background: var(--tint); color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .banner span { flex: 1; }
  main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px 20px; }
  .banner { flex: none; }
  section { margin-top: 14px; }
  .proj { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--tint); font-weight: 700; }
  .proj i { width: 4px; height: 18px; border-radius: 2px; background: var(--accent); flex: none; }
  .proj b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj small { font-weight: 400; color: var(--sub); }
/* 날짜순: 머리줄은 날짜 묶음(지남 · 오늘 빨강, 내일 주황, 나머지 회색), 줄 앞에 프로젝트 이름 */
section.b0 { --sc: var(--red); } section.b1 { --sc: var(--orange); } section.b2, section.b3, section.b4 { --sc: var(--sub); }
.psec { font-size: 12px; font-weight: 600; color: var(--sub);     /* 프로젝트 색이 있으면 headInk 로 카드 위 4.5 맞춘 색(보라 · 옅은 노랑이 4.2 · 4.3 이었다, 2.2.91) */ margin-right: 2px; }
  .item { display: flex; gap: 10px; padding: 11px 4px 10px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .box { flex: none; width: 24px; height: 24px; margin-top: 1px; border: 1.6px solid var(--faint); border-radius: 7px; background: var(--card); padding: 0; position: relative; }
  /* 단계가 진행 중: 옅은 색 바탕 + 색 테두리(눌러 둔 것처럼 보이지 않게) */
  .box.part { border-color: var(--faint); background: var(--card); }
  /* 동그란 체크(To Do · Todoist 식). 단계 진행 중이면 안을 진행한 만큼 부채꼴로(Things 의 진행 원) */
  .board .box { border-radius: 50%; }
/* 누르는 자리 넓히기(보이는 크기는 그대로): 동그라미 · ✕ · 알약이 손가락에 작던 것(애플 권장 44px) */
.box::before { content: ""; position: absolute; inset: -10px -6px -10px -10px; }     /* 오른쪽(제목 쪽)은 6px 만: 제목 첫 글자를 눌러 체크되지 않게 */
.bx, .bchip, .chip { position: relative; }
.bx::before { content: ""; position: absolute; inset: -10px -8px; }
.bchip::before, .chip::before { content: ""; position: absolute; inset: -7px -3px; }
/* 기능 단추 설명은 잘리지 않게 줄바꿈(문구 미리보기는 한 줄로 자른 채 둔다) */
#shareOpen small, #linksOpen small, #projShare small, #projShareBare small { white-space: normal; overflow: visible; text-overflow: clip; }
  .board .box.part::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(color-mix(in srgb, var(--sc, var(--accent)) 75%, var(--card)) var(--p, 30%), transparent 0); }
  .board .prog { display: none; }
  .body { flex: 1; min-width: 0; }
  .text { word-break: keep-all; overflow-wrap: anywhere; }     /* 한글을 낱말 가운데서 끊지 않는다(띄어쓰기에서만, 너무 긴 낱말만 끊음) */
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; font-size: 12.5px; color: var(--sub); }
  .due { font-weight: 700; }
  .star { color: var(--orange); }
  .due.late { color: color-mix(in srgb, var(--red) 72%, var(--text)); } .due.soon { color: color-mix(in srgb, var(--orange) 58%, var(--text)); }     /* 옅은 바탕 위 작은 글씨 대비 4.5 */ .due.far { color: var(--sub); font-weight: 400; }
  .more { margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--tint); font-size: 13.5px; color: var(--sub); }
  .steps { margin: 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .steps li span { flex: 1; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
  .steps li.done span { text-decoration: line-through; color: var(--faint); }
  .steps li.now span { color: var(--text); font-weight: 700; }
  .steps li button, .acts button { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; }
  .note { white-space: pre-wrap; margin-top: 8px; color: var(--text); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  /* 부제: 프로젝트 색 알약(이름 · 개수) + 옅은 줄 */
  .subh { margin: 12px 12px 4px; display: flex; align-items: center; gap: 10px; }
  /* 부제: 프로젝트보다 작고 조용하게(작은 색 네모 + 회색 글씨 · 개수) */
  .subh span { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 700; color: var(--sub); }
  .subh span::before { content: ""; width: 7px; height: 7px; background: var(--sc, var(--accent)); flex: none; }
  .subh span b { margin-left: 0; font-weight: 400; opacity: .8; }
  .subh::after { content: ""; flex: 1; height: 1px; background: var(--line, rgba(127,127,127,.18)); }
  /* 펼친(고른) 할 일: 왼쪽 막대 + 옅은 바탕 */
  .item.open { background: color-mix(in srgb, var(--accent) 6%, var(--card)); box-shadow: inset 4px 0 0 var(--accent); }
  .note a.link { color: #1A73E8; text-decoration: underline; word-break: break-all; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note a.link { color: #8AB4F8; } }
  :root[data-theme="dark"] .note a.link { color: #8AB4F8; }
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 6px; }
  .quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 12px; text-align: left; font-weight: 600; }
  .quick button small { font-weight: 400; opacity: .65; font-size: 12px; }
  .quick button.on { outline: 2px solid var(--accent); }
  .latebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px;     /* 좁은 폰 · 큰 글자 · 영어에서 단추가 화면 밖으로 나가지 않게 줄바꿈 */ margin: 10px 2px 2px; padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, #D93025 12%, transparent); }
  .latebar span { flex: 1 1 auto; min-width: 7em; font-weight: 600; color: #D93025; }
  .latebar button { font-size: 13px; padding: 5px 11px; border-radius: 999px; }
  .empty { text-align: center; color: var(--sub); padding: 48px 0; }
  footer { flex: none; background: var(--back); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  #newText { flex: 1; } #newSection { flex: 1; } #newSub { flex: 1; } #newDue { flex: none; width: 138px; }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--accent); color: var(--on-accent); padding: 9px 14px; border-radius: 999px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  .toast button { background: color-mix(in srgb, var(--on-accent) 18%, transparent); border: 0; color: inherit; font-weight: 700; padding: 5px 11px; border-radius: 999px; text-decoration: none; }
  .toast { box-shadow: 0 8px 24px rgba(0,0,0,.22); padding: 7px 8px 7px 16px; animation: toastIn .18s ease-out; }
  .toast { max-width: calc(100vw - 24px); box-sizing: border-box; }
  .toast #toastText { white-space: normal; line-height: 1.35; }
  .toast button { flex: none; white-space: nowrap; }
  .lfoot { margin: 18px 12px 8px; text-align: center; font-size: 12px; color: var(--sub); line-height: 1.5; }     /* 작은 글씨라 대비 4.5(옅은 --faint 는 3.2 였다) */
  .toast #toastText::before { content: "✓"; display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; margin-right: 8px; border-radius: 50%; background: color-mix(in srgb, var(--on-accent) 22%, transparent); font-size: 11px; font-weight: 800; }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .shade { position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; overscroll-behavior: contain; }
  .sheet { width: 100%; max-height: 88%; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--back); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .row input { flex: 1; width: auto; }
  .have { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; color: var(--sub); }
  .have li { padding: 3px 0; }
  .have li.new { color: var(--text); font-weight: 700; }
  .sheet h2 { font-size: 17px; margin: 0 0 14px; display: flex; align-items: center; gap: 10px; }
  .sheet h2::before { content: ""; width: 5px; height: 20px; border-radius: 3px; background: var(--accent); flex: none; }
  .sheet::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--sub) 40%, transparent); margin: -6px auto 12px; }
  .sheet textarea, .sheet select { border-radius: 12px; border: 1px solid color-mix(in srgb, var(--sub) 30%, transparent); background: var(--card); color: var(--text); padding: 10px 12px; font-size: 15px; box-sizing: border-box; }
  .sheet textarea:focus, .sheet select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .sheet .end button { padding: 10px 18px; border-radius: 12px; font-weight: 600; }
  .sheet .end button.primary { background: var(--accent); color: var(--on-accent); border: 0; }
  .sheet textarea, .sheet input { width: 100%; }
  .sheet select { width: 100%; margin-bottom: 8px; }
  .brief { margin: 10px 2px 4px; padding: 12px 14px; border-radius: 16px; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .bhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bhead b { flex: 1; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .bhead b::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
  .bx { background: none; border: 0; color: var(--sub); font-size: 14px; padding: 2px 6px; }
  .bchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .bchip { border: 0; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; }
  .bchip.stuck { background: color-mix(in srgb, var(--red) 72%, #000); color: #fff; }
  .bchip.late { background: color-mix(in srgb, var(--red) 16%, var(--card)); color: color-mix(in srgb, var(--red) 72%, var(--text)); }     /* 옅은 바탕 위 작은 글씨 대비 4.5(그냥 빨강은 약 4) */
  .bchip.today { background: color-mix(in srgb, var(--orange) 16%, var(--card)); color: color-mix(in srgb, var(--orange) 58%, var(--text)); }     /* 주황은 2.6 이었다 */
  .bchip.rolled { background: var(--tint); color: var(--sub); }
  .bchip.calm { background: color-mix(in srgb, #1E8E3E 14%, var(--card)); color: #1E8E3E; }
  .item.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 18%, var(--card)); } 100% { background: transparent; } }
  .lday { margin: 10px 2px 12px; background: var(--card); border-radius: 16px; padding: 4px 14px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .lhead { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; }
  .lhead b { font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .lhead b::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
  .ltoday { font-size: 12px; font-weight: 700; color: var(--accent); }
  .lcnt { margin-left: auto; font-size: 12px; color: var(--sub); }
  .lday .ev { border-bottom: 0; border-top: 1px solid var(--line, rgba(127,127,127,.15)); padding: 10px 0; }
  .lday .ev .what { font-weight: 700; }
  .lday .ev .what small { font-weight: 400; }
  .lrow { padding: 9px 0; border-top: 1px solid var(--line, rgba(127,127,127,.15)); }
  .ltitle { font-weight: 700; font-size: 14.5px; word-break: keep-all; overflow-wrap: anywhere; }
.ldetail { margin-top: 3px; font-size: 13px; color: var(--sub); word-break: keep-all; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }     /* 내용 · 성과: PC 카드처럼 제목 아래 회색 두 줄까지 */
  /* 시안 A(PC 업무 기록 · 일정과 같게): 날짜마다 카드, 머리는 옅은 파란 띠, 줄 사이 가는 선 */
  .lday { padding: 0; overflow: hidden; }
  .lhead { padding: 10px 14px; background: color-mix(in srgb, #1a73e8 11%, var(--card)); color: color-mix(in srgb, #1a73e8 72%, var(--text)); }
  .lhead b::before { display: none; }
  .ltoday { color: inherit; }
  .lday > .ev, .lday > .lrow { padding-left: 14px; padding-right: 14px; }
  .lday > .lhead + .ev, .lday > .lhead + .lrow { border-top: 0; }
  .lchip { display: inline-block; margin-top: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--pc, var(--sub)) 16%, var(--card)); color: var(--pci, color-mix(in srgb, var(--pc, var(--sub)) 85%, var(--text))); }     /* --pci: 옅은 프로젝트 색이어도 대비 4.5 (headInk) */
  .logbar { display: flex; gap: 8px; margin: 4px 12px 10px; }
  .logbar button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--line, rgba(127,127,127,.25)); background: var(--card); color: var(--text); font-weight: 600; }
  .sheet label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  .sheet .end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .lkrows { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .lkrow { display: grid; grid-template-columns: 96px 1fr auto auto; gap: 6px; align-items: center; }
  .lkrow input { width: 100%; padding: 7px 8px; }
  .lkrow span { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .lkrow button { padding: 6px 9px; }
  .phrase.subto { margin-left: 22px; width: calc(100% - 22px); }
  .phrase { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 12px; }
  .phrase small { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #picker { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; }
  .day { margin: 16px 0 6px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .ev { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ev .when { flex: none; width: 46px; font-size: 13px; color: var(--sub); padding-top: 1px; }
  .ev .bar { flex: none; width: 4px; align-self: stretch; border-radius: 2px; background: var(--accent); }
  .ev .what { flex: 1; min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
  .ev small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
  body.plain main { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  body.plain footer { display: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .swatches button.on { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--back); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border-radius: 999px; padding: 6px 14px; }
  .seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .sheet a { color: var(--sub); }
  header { background: color-mix(in srgb, var(--back) 70%, transparent); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); }
  .top { gap: 6px; }
  .top .icon { flex: none; width: 42px; height: 42px; padding: 0; border-radius: 21px; display: grid; place-items: center; }
  .top .icon svg { width: 20px; height: 20px; }
  .find { position: relative; display: flex; margin: 10px 0 2px; }
  .find input { width: 100%; height: 42px; border-radius: 21px; padding: 0 14px 0 40px; font-size: 16px; background: var(--card); border: 1px solid var(--line); }
  .find .lens { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
  .find .lens svg { width: 100%; height: 100%; }
  /* ② 입력 줄 접기: 평소엔 할 일 한 줄, 입력칸을 누르면 프로젝트 · 마감일 줄이 펼쳐진다 */
  footer:not(.open) .row + .row { display: none; }
  mark { background: #ffe082; color: #202124; border-radius: 3px; padding: 0 1px; }
  .item, .proj, .steps li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  section { margin-top: 14px; background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.06); }

  .board .subh span { color: var(--sci, color-mix(in srgb, var(--sc, var(--accent)) 55%, var(--text))); }
  .board .subh span::before { display: none; }
  /* 마감은 카드 오른쪽 위 */

  .board .item .meta .due { position: absolute; top: 12px; right: 12px; }
  .board .item:has(.meta .due) .text { padding-right: 104px; }
html[lang="en"] .board .item:has(.meta .due) .text { padding-right: 140px; }     /* 영어 마감 알약이 길다(1d overdue · Repeats · today) */
/* 글자 크게 · 아주 크게: 마감 알약을 오른쪽 위에 띄우면 제목 칸이 좁아 한두 글자씩 줄이 바뀐다 → 아래 정보 줄 맨 앞으로 */
body.big .board .item .meta .due { position: static; order: -1; }
body.big .board .item:has(.meta .due) .text { padding-right: 0; }
  .prog { display: inline-block; width: 46px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--sub) 22%, transparent); vertical-align: middle; overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 3px; background: var(--sc, var(--accent)); }
  .meta .due { padding: 1px 8px; border-radius: 999px; background: var(--tint); }
  .meta .due.late { background: color-mix(in srgb, var(--red) 16%, var(--card)); }
  .meta .due.soon { background: color-mix(in srgb, var(--orange) 16%, var(--card)); }
  /* 3일 넘게 밀린 일: 진한 빨강 바탕 + 흰 글씨로 오늘 마감과 구별 */

  .past { color: var(--sub); font-size: 12px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

<script>
// ───── 설정: 구글 웹 클라이언트 ID. 비어 있으면 견본 자료로만 돈다. ─────
const CLIENT_ID = "912022312060-10gaphh68u5fqdnmmoqdncu5d429g3uf.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const STATE_FILE = "planner-state.json";     // PC 가 올리는 현재 목록
const INBOX_FILE = "planner-inbox.json";     // 폰에서 한 일. PC 가 가져가서 반영한다
// 앱(아이폰 · 안드로이드)으로 감쌌을 때: 앱이 window.PlannerNative = { signIn(), copy(text) } 를 넣어 주면 그걸 쓴다.
const native = () => window.PlannerNative || null;
// 메모 속 주소(https://…, www.…)는 눌러 열 수 있게. 앱이 PlannerNative.openUrl(url) 을 주면 그걸로(바깥 브라우저) 연다.
const linkify = s => esc(s).replace(/(?:https?:\/\/|www\.)[^\s<>"']+/g, m => { const u = m.replace(/[.,)]+$/, ""), rest = m.slice(u.length);
  return `<a class="link" href="${/^www\./i.test(u) ? "https://" + u : u}" target="_blank" rel="noopener">${u}</a>${rest}`; });
function openLink(url) {
  try { if (window.PlannerNative?.openUrl) { window.PlannerNative.openUrl(url); return; } } catch {}
  window.open(url, "_blank", "noopener");
}
// 앱이 광고 띠를 띄우거나 없앨 때 부른다(광고 제거를 사면 0). 웹 화면에는 광고가 없다.
window.plannerSetAdHeight = px => document.documentElement.style.setProperty("--ad", (Number(px) || 0) + "px");

const $ = id => document.getElementById(id);
const day = d => d.toISOString().slice(0, 10);
const today = () => day(new Date(Date.now() - new Date().getTimezoneOffset() * 60000));
const md = s => s ? Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10)) : "";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const newKey = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let state = load("state", null);          // PC 에서 받은 목록
let inbox = load("inbox", []);            // 아직 PC 가 가져가지 않은 내 변경
let filter = load("view", "all") === "next" ? "next" : "all", opened = null,     /* 지난번 고른 보기(전체 · 날짜순)로 연다 */ token = null, picked = false, problem = "", query = "", booting = true;
// 찾기: 띄어 쓴 말이 모두 들어 있는 것만 남긴다
const words = () => query.toLowerCase().split(/\s+/).filter(Boolean);
const hits = (...texts) => { const all = texts.join("\n").toLowerCase(); return words().every(w => all.includes(w)); };
const mark = s => { let out = esc(s); for (const w of words()) out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => "<mark>" + m + "</mark>"); return out; };
let demo = (!CLIENT_ID && !native()) || new URLSearchParams(location.search).has("demo");
const selftestOn = new URLSearchParams(location.search).has("selftest");     // 켜자마자 읽어 둔다(주소는 곧 정리된다)   // ?demo 를 붙이면 견본 자료로만 돈다(시험용)

function sample() {
  const t = today(), plus = n => day(new Date(Date.parse(t) + n * 86400000));
  return { updated: new Date().toISOString(), sections: ["매일 하는 일", "가을 행사", "거래처"], pinned: ["매일 하는 일"],
    colors: { "가을 행사": "#8E24AA", "거래처": "#00897B" },
    events: [{ title: "주간 회의", allDay: false, start: t + "T10:30", end: t + "T11:30", last: t, calendar: "업무", color: "#1A73E8" },
             { title: "가을 행사 준비 기간", allDay: true, start: plus(1) + "T00:00", end: plus(4) + "T00:00", last: plus(3), calendar: "행사", color: "#8E24AA" },
             { title: "거래처 미팅", allDay: false, start: plus(2) + "T15:00", end: plus(2) + "T16:00", last: plus(2), calendar: "", color: "" }],
    logs: [{ date: t, section: "매일 하는 일", title: "주문 확인" }, { date: plus(-1), section: "가을 행사", title: "장소 확정" }, { date: plus(-1), section: "거래처", title: "견적서 발송", detail: "단가표 2종 첨부 · 회신은 다음 주 화요일까지 받기로" }],
    phrases: [{ name: "입고지 안내", text: "입고지 정보 전달드립니다!\n\n입고지: (주소)\n담당자: (이름)\n연락처: (번호)" },
              { name: "출고일 안내", text: "{업체명} 담당자님, 안녕하세요.\n{상품명} 출고일은 {출고일}입니다." }],
    todos: [
    { id: "s1", section: "매일 하는 일", text: "주문 확인 → 출고 요청", steps: ["주문 확인", "출고 요청"], step: 0, due: t, stepDues: [], notes: "", repeat: true },
    { id: "s2", section: "매일 하는 일", text: "문의 메일 답장", steps: ["문의 메일 답장"], step: 0, due: t, stepDues: [], notes: "", repeat: true },
    { id: "s3", section: "가을 행사", text: "장소 확정 → 안내문 작성 → 참석자에게 발송", steps: ["장소 확정", "안내문 작성", "참석자에게 발송"], step: 1, due: plus(2), stepDues: [plus(-1), plus(2), plus(7)], notes: "작년 안내문 참고\n참석 예정 40명", repeat: false },
    { id: "s4", section: "가을 행사", text: "인쇄물 견적 받기", steps: ["인쇄물 견적 받기"], step: 0, due: "", stepDues: [], notes: "", repeat: false, created: plus(-12) },
    { id: "s5", section: "거래처", text: "계약서 수정 사항 확인", steps: ["계약서 수정 사항 확인"], step: 0, due: plus(-1), stepDues: [], notes: "", repeat: false, files: 2 },
    { id: "s6", section: "거래처", text: "대표님 검토 → 전자 계약 발송", steps: ["대표님 검토", "전자 계약 발송"], step: 0, due: plus(9), stepDues: [], notes: "", repeat: false, star: true, remind: t + " 15:00" } ] };
}

// PC 에서 받은 목록에 아직 안 넘어간 내 변경을 겹쳐서 보여 준다(PC 와 같은 규칙으로).
function view() {
  const todos = (state ? state.todos : []).map(x => ({ ...x, steps: [...(x.steps || [x.text])], stepDues: [...(x.stepDues || [])] }));
  const sync = item => { if (item.stepDues.some(Boolean)) item.due = item.stepDues[Math.min(item.step, item.stepDues.length - 1)] || ""; };
  for (const op of inbox) {
    if (op.op === "rename") { todos.forEach(x => { if ((x.section || "") === op.from) x.section = op.to; }); continue; }
    if (op.op === "add") { todos.push({ id: op.id, section: op.section, sub: op.sub || "", text: op.text, steps: [op.text], step: 0, due: op.due || "", stepDues: [], notes: "" }); continue; }
    if (op.op === "move") {
      const from = todos.findIndex(x => x.id === op.id);
      if (from < 0 || op.before === op.id) continue;
      const [it] = todos.splice(from, 1); it.section = op.section; if (op.sub !== undefined) it.sub = op.sub;
      let at = op.before ? todos.findIndex(x => x.id === op.before) : -1;
      if (at < 0) { at = todos.length; for (let k = todos.length - 1; k >= 0; k--) if ((todos[k].section || "") === op.section) { at = k + 1; break; } }
      todos.splice(at, 0, it); continue;
    }
    if (op.op === "moveSection") continue;
    if (op.op === "renameSub") { todos.forEach(x => { if ((x.section || "") === op.section && x.sub === op.from) x.sub = op.to; }); continue; }
    if (op.op === "dropSub") { todos.forEach(x => { if ((x.section || "") === op.section && x.sub === op.sub) x.sub = ""; }); continue; }
    if (op.op === "dueMany") {
      for (const it of todos.filter(x => op.ids.split(",").includes(x.id))) {
        if (it.due && it.due < today() && !it.lateFrom && op.due >= today()) it.lateFrom = it.due;     // n일 밀림
        if (it.stepDues.some(Boolean)) { it.stepDues[Math.min(it.step, it.stepDues.length - 1)] = op.due; sync(it); } else it.due = op.due;
      }
      continue;
    }
    const item = todos.find(x => x.id === op.id);
    if (!item) continue;
    if (op.op === "check") { if (item.step < item.steps.length - 1) { item.step++; sync(item); } else item.gone = true; }
    if (op.op === "back" && item.step > 0) { item.step--; sync(item); }
    if (op.op === "note") item.notes = item.notes ? item.notes.trimEnd() + "\n" + op.text : op.text;
    if (op.op === "edit" && item.steps.length < 2) { item.text = op.text; item.steps = [op.text]; }
    if (op.op === "editStep" && op.step < item.steps.length) item.steps[op.step] = op.text;
    if (op.op === "delete") item.gone = true;
    if (op.op === "star") item.star = !!op.on;
    if (op.op === "dup") { const copy = { ...item, id: op.newId, step: 0, steps: [...item.steps], stepDues: [...item.stepDues], remind: "" }; sync(copy); todos.splice(todos.indexOf(item) + 1, 0, copy); }
    if (op.op === "extract" && op.step >= item.step && op.step < item.steps.length && item.steps.length - item.step >= 2) {
      const had = item.stepDues.some(Boolean), name = item.steps[op.step], due = had ? item.stepDues[op.step] || "" : "";
      item.steps.splice(op.step, 1); if (had) item.stepDues.splice(op.step, 1);
      if (had && item.steps.length === 1) { item.due = item.stepDues[0] || ""; item.stepDues = []; } else sync(item);
      item.text = item.steps.join(" → ");
      const fresh = { id: op.newId, section: op.section, sub: op.section === (item.section || "") ? item.sub : "", text: name, steps: [name], step: 0, due, stepDues: [], notes: "" };
      let at = op.before ? todos.findIndex(x => x.id === op.before) : -1;
      if (at < 0) { if (op.section === (item.section || "")) at = todos.indexOf(item) + 1; else { at = todos.length; for (let k = todos.length - 1; k >= 0; k--) if ((todos[k].section || "") === op.section) { at = k + 1; break; } } }
      todos.splice(at, 0, fresh);
    }
    if (op.op === "split" && item.steps.length - item.step >= 2) {
      const had = item.stepDues.some(Boolean);
      const made = item.steps.slice(item.step).map((n, i) => { const si = item.step + i;
        return { id: op.key + "-" + si, section: item.section, sub: item.sub, text: n, steps: [n], step: 0, due: had ? item.stepDues[si] || "" : si === item.steps.length - 1 ? item.due : "", stepDues: [], notes: i === 0 ? item.notes : "", star: i === 0 && item.star }; });
      todos.splice(todos.indexOf(item), 1, ...made);
    }
    if (op.op === "addStep") { item.steps.push(op.text); if (item.stepDues.some(Boolean)) item.stepDues.push(""); }
    if (op.op === "moveStep" && op.from < item.steps.length && op.to < item.steps.length) {
      const [s] = item.steps.splice(op.from, 1); item.steps.splice(op.to, 0, s);
      if (item.stepDues.some(Boolean)) { while (item.stepDues.length < item.steps.length) item.stepDues.push(""); const [d] = item.stepDues.splice(op.from, 1); item.stepDues.splice(op.to, 0, d); sync(item); }
      item.text = item.steps.join(" → ");
    }
    if (op.op === "due") {
      const many = item.steps.length > 1;
      if (many && op.step != null) { while (item.stepDues.length < item.steps.length) item.stepDues.push(""); item.stepDues[op.step] = op.due; sync(item); if (!item.stepDues.some(Boolean)) { item.stepDues = []; item.due = ""; } }
      else if (item.stepDues.some(Boolean)) { item.stepDues[Math.min(item.step, item.stepDues.length - 1)] = op.due; sync(item); }
      else item.due = op.due;
    }
  }
  return todos.filter(x => !x.gone);
}

// 프로젝트 순서: PC 가 보낸 순서에 아직 안 넘어간 이름 바꾸기 · 순서 바꾸기를 겹친다.
function sectionOrder() {
  let secs = [...((state && state.sections) || [])];
  for (const op of inbox) {
    if (op.op === "rename") secs = secs.map(s => s === op.from ? op.to : s);
    if (op.op === "moveSection" && secs.includes(op.name)) {
      secs = secs.filter(s => s !== op.name);
      const at = op.end === "1" ? -1 : secs.indexOf(op.before);
      if (at < 0) secs.push(op.name); else secs.splice(at, 0, op.name);
    }
  }
  return secs;
}

// PC 에서 정한 알림 시각: 오늘 · 내일이면 그렇게, 아니면 날짜
function remindLabel(s) {
  const d = s.slice(0, 10), hm = s.slice(11, 16), t = today(), tm = day(new Date(Date.parse(t) + 86400000));
  return (d === t ? (isEn() ? "today " : "오늘 ") : d === tm ? (isEn() ? "tomorrow " : "내일 ") : md(d) + " ") + hm;
}

function dueLabel(item) {
  if (!item.due) return item.repeat ? { text: "반복", cls: "far" } : null;
  const left = Math.round((Date.parse(item.due) - Date.parse(today())) / 86400000);

let toastTimer = null, lastOp = null;

}

function push(op, said) { op.key = op.key || newKey(); op.at = new Date().toISOString(); inbox.push(op); save("inbox", inbox); render(); send(); if (said) toast(said, op); }

function add() {

  let section = $("newSection").value, sub = $("newSub").hidden ? "" : $("newSub").value;

  if (put) { section = put[1].trim(); sub = (put[2] || "").trim(); text = put[3].trim(); }

  push({ op: "add", id, key: id, section, sub, text, due }, put ? "'" + (section || "기타") + (sub ? " › " + sub : "") + "' 에 추가했습니다" : worded ? "마감 " + dayTitle(due).replace(" · 오늘", "") + "로 추가했습니다" : "추가했습니다");

// ───── 아래에서 올라오는 작은 창(글 쓰기 · 문구 고르기 · 빈칸 채우기) ─────

// 날짜 고르기: 숨겨 둔 날짜 칸을 연다. 고른 날이 없으면(지우기) 빈 값.
// 줄 끝의 말로 쓴 마감일(PC 의 TakeWordDue 와 같은 규칙): 내일 · 모레 · 금요일까지 · 다음 주 월요일 · 3일 뒤 · 월말 · 주말
// 영어로 쓴 마감(PC 와 같음): 줄 끝의 영어 말을 같은 뜻의 한국어 말로 바꾼 뒤 위 규칙을 그대로 쓴다
function enDue(text) {
  const days = { sun: "일", mon: "월", tue: "화", wed: "수", thu: "목", fri: "금", sat: "토" };
  return text.replace(/\s+(?:by\s+|due\s+|until\s+)?(?:(today|tonight)|(tomorrow|tmrw)|(end\s+of\s+(?:the\s+)?month)|((?:this\s+)?weekend)|(next\s+week)|in\s+(\d{1,3})\s+days?|(?:(this|next)\s+)?(sun|mon|tue|wed|thu|fri|sat)(?:day|sday|nesday|rsday|urday)?)\s*$/i,
    (all, a, b, c, d, e, n, w, dn) => " " + (a ? "오늘" : b ? "내일" : c ? "월말" : d ? "주말" : e ? "다음 주" : n ? n + "일 뒤" : (w ? (w.toLowerCase() === "next" ? "다음 주 " : "이번 주 ") : "") + days[dn.toLowerCase()] + "요일"));
}
function wordDue(text) {
  text = enDue(text);
  const m = text.match(/\s+(?:(오늘|내일|모레|월말|이번\s?주\s?말|주말)|(?:(이번\s?주|다음\s?주|다다음\s?주)\s?)?([월화수목금토일])요일|(다음\s?주)|(\d{1,3})\s?일\s?(?:뒤|후))(?:\s?까지)?\s*$/);
  if (!m || m.index === 0) return null;
  const t = Date.parse(today()), wd = new Date(t).getUTCDay(), at = n => day(new Date(t + n * 86400000));
  let due;
  if (m[1]) {
    const w = m[1].replace(/\s/g, "");
    if (w === "오늘") due = at(0); else if (w === "내일") due = at(1); else if (w === "모레") due = at(2);
    else if (w === "월말") { const d = new Date(t); due = day(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); }
    else due = at((6 - wd + 7) % 7);
  } else if (m[3]) {
    const want = "일월화수목금토".indexOf(m[3]), week = (m[2] || "").replace(/\s/g, "");
    if (!week) due = at((want - wd + 7) % 7);
    else due = at(-((wd + 6) % 7) + 7 * (week === "이번주" ? 0 : week === "다음주" ? 1 : 2) + (want + 6) % 7);
  } else if (m[4]) due = at((1 - wd + 7) % 7 || 7);

}
function quickDues() {
  const t = Date.parse(today()), wd = new Date(t).getUTCDay(), at = n => day(new Date(t + n * 86400000)), list = [["오늘", at(0)], ["내일", at(1)]];
  const toFri = (5 - wd + 7) % 7, toMon = (1 - wd + 7) % 7;

const COLORS = ["#212121", "#1A73E8", "#00897B", "#188038", "#E37400", "#D93025", "#8E24AA", "#5F6368"];

async function copy(text) {

}

function moveTo(item) {
  const here = item.section || "", hereSub = item.sub || "", all = view();

  const targets = [];

  }

  sheet(`<h2>어디로 옮길까요?</h2>` + targets.map((g, i) => `<button class="phrase${g.sub ? " subto" : ""}" data-to="${i}">${g.sub ? "› " + esc(g.sub) + `<small>${esc(g.section || "기타")}</small>` : esc(g.section || "기타")}</button>`).join("")
    + `<div class="end"><button data-close>취소</button></div>`, s => {

// 남은 일 글(PC [목록 복사] 와 같은 모양): [프로젝트/부제] 아래 □ 할 일 → 다음 단계, • 메모. 끝낸 단계가 둘 이상이면 (끝낸 n단계)
function shareText(only, bare) {
  const d = new Date(), groups = {}, order = [];
  // 화면에 놓인 차례대로(고정 프로젝트가 위): 그려진 할 일 순서를 따르고, 화면에 없는 것은 뒤에
  const shown = [...document.querySelectorAll(".item[data-id]")].map(e => e.dataset.id), rank = x => { const i = shown.indexOf(x.id); return i < 0 ? 1e9 : i; };
  for (const x of view().filter(x => only == null || (x.section || "") === only)     /* 빈 이름("프로젝트 없음")도 그 묶음만 */.slice().sort((a, b) => rank(a) - rank(b))) { const k = (x.section || "기타") + (x.sub ? "/" + x.sub : ""); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(x); }

}function showPhrases() {

// ───── 구글 드라이브(앱 전용 숨김 폴더) ─────
async function api(path, options) {
  const res = await fetch("https://www.googleapis.com/" + path, { ...options, headers: { Authorization: "Bearer " + token, ...((options || {}).headers || {}) } });
  if (res.status === 401) { token = null; throw new Error("auth"); }
  if (!res.ok) throw new Error("구글 응답 " + res.status);
  return res;
}
async function findFile(name) {
  const res = await api("drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=" + encodeURIComponent("name='" + name + "'"));
  return ((await res.json()).files || [])[0] || null;
}
async function readFile(name) {
  const file = await findFile(name);
  return file ? (await api("drive/v3/files/" + file.id + "?alt=media")).json() : null;
}
async function writeFile(name, value) {
  const file = await findFile(name), body = JSON.stringify(value);
  if (file) return api("upload/drive/v3/files/" + file.id + "?uploadType=media", { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({ name, parents: ["appDataFolder"] })], { type: "application/json" }));
  form.append("file", new Blob([body], { type: "application/json" }));
  return api("upload/drive/v3/files?uploadType=multipart", { method: "POST", body: form });
}

    const items = [...document.querySelectorAll(".item")].filter(x => !x.querySelector(".star"));
    let a = null, b = null;
    for (let k = 1; k < items.length; k++)
      if (items[k].dataset.sec === items[k - 1].dataset.sec && items[k].dataset.sub === items[k - 1].dataset.sub) { a = items[k]; b = items[k - 1]; break; }
    if (a && b) {
      a.scrollIntoView({ block: "center" }); await W(200);
      const ra = a.querySelector(".text").getBoundingClientRect(), rb = b.querySelector(".text").getBoundingClientRect();
      const before = [...document.querySelectorAll(".item .text")].map(x => x.textContent).join("|");
      // 위의 것(b)을 아래 것(a) 밑으로 끌어내린다: 위로 끌면 키 작은 폰에서 놓는 자리가 위쪽 막대 밑이 될 수 있다
      const x = rb.left + rb.width / 2, y0 = rb.top + rb.height / 2, y1 = ra.bottom + 20, el = document.elementFromPoint(x, y0);
      const fire = (t, yy) => el.dispatchEvent(new PointerEvent(t, { bubbles: true, cancelable: true, clientX: x, clientY: yy, pointerId: 1, pointerType: "touch", isPrimary: true, button: 0, buttons: t === "pointerup" ? 0 : 1 }));
      fire("pointerdown", y0); await W(700);
      for (let yy = y0; yy <= y1; yy += 7) { fire("pointermove", yy); await W(30); }
      fire("pointerup", y1); await W(700);
      check("흐름: 끌어서 순서 바꾸기", [...document.querySelectorAll(".item .text")].map(x => x.textContent).join("|") !== before);
    } else check("흐름: 끌어서 순서 바꾸기", false, "할 일이 2개 미만");
    const setBtn = document.querySelectorAll("header button")[1]; if (setBtn) setBtn.click(); await W(500);
    const sh = document.querySelector(".sheet");
    check("설정 시트 열림", !!sh);
    // 시트 스크롤: 화면보다 길어지면 시트 안에서 스크롤되는지(높이 제한 + 넘치면 스크롤)
    if (sh) { const cs = getComputedStyle(sh); check("흐름: 시트 스크롤", (cs.overflowY === "auto" || cs.overflowY === "scroll") && sh.getBoundingClientRect().height <= innerHeight, cs.overflowY + " · " + Math.round(sh.getBoundingClientRect().height) + "/" + innerHeight); }
    closeSheet(); await W(300);
    // 문구 시트: 기능 단추 설명이 "…" 로 잘리지 않는지
    $("phrases").click(); await W(500);
    { const cut = [...document.querySelectorAll("#shareOpen small, #linksOpen small")].filter(e => e.scrollWidth > e.clientWidth + 1).length; check("문구 시트 설명 안 잘림", document.querySelectorAll("#shareOpen small, #linksOpen small").length === 2 && cut === 0, cut + "개 잘림"); }
    closeSheet();
    // 글씨 대비(WCAG): 밝은 · 어두운 화면 모두 할 일 글씨 4.5 이상, 굵은 머리 글씨 3 이상
    const rgb = s => { const m = s.match(/[\d.]+/g) || []; const n = m.map(Number); if (s.startsWith("color(")) return n.slice(0, 3).map(v => v * 255); return n.slice(0, 3); };
    const lum = c => { const [r, g, b] = c.map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const bgOf = el => { for (let e = el; e; e = e.parentElement) { const c = getComputedStyle(e).backgroundColor; if (c && !/rgba\(0, 0, 0, 0\)|transparent/.test(c)) return rgb(c); } return [255, 255, 255]; };
    const ratio = el => { if (!el) return 0; const a = lum(rgb(getComputedStyle(el).color)), b = lum(bgOf(el)); return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05); };
    const before = document.documentElement.dataset.theme;
    const t9min = { v: 99, c: "" };     // 날짜순 줄 앞 프로젝트 이름: 여러 프로젝트 색 중 가장 낮은 대비
    for (const mode of ["light", "dark"]) {
      document.documentElement.dataset.theme = mode; tab("전체"); await W(300);
      const t1 = ratio(document.querySelector(".item .text")), t2 = ratio(document.querySelector("section .proj b"));
      const t8 = Math.min(99, ...[...document.querySelectorAll(".bchip, .meta .due")].map(ratio));     // 오늘 카드 알약 · 할 일 줄 마감 알약     // 오늘 카드 알약들(지난 · 오늘 · 이번 주 등)
      tab("날짜순"); await W(300); const t9 = Math.min(99, ...[...document.querySelectorAll(".uphead b, .uphead small, .psec")].map(ratio)); { const host = document.querySelector(".item .text"); if (host) for (const c of [...COLORS, "#ffeb3b", "#81d4fa", "#f8bbd0", "#212121", "#9c27b0"]) { const s = document.createElement("span"); s.className = "psec"; s.style.color = headInk(c, isDark(), 0); s.textContent = "x"; host.prepend(s); const r = ratio(s); s.remove(); if (r < t9min.v) t9min.v = r, t9min.c = c; } } tab("전체"); await W(200);     // 날짜순 머리줄(오늘 빨강 · 내일 주황 · 회색) · 줄 앞 프로젝트 이름
      tab("기록"); await W(300);
      const t3 = ratio(document.querySelector(".lhead b")), t4 = ratio(document.querySelector(".ldetail")), t5 = ratio(document.querySelector(".lfoot"));     // 기록 내용(회색) · 아래 안내 글
      tab("일정"); await W(300); const t7 = ratio(document.querySelector(".ev small") || document.querySelector(".lfoot"));     // 일정 캘린더 이름(작은 글씨)
      check("대비(" + (mode === "light" ? "밝게" : "어둡게") + ")", t9 >= 4.5 && t9min.v >= 4.5 && t8 >= 4.5 && t7 >= 4.5 && t1 >= 4.5 && t2 >= 3 && t3 >= 3 && t4 >= 4.5 && t5 >= 4.5, "할 일 " + t1.toFixed(1) + " · 프로젝트 " + t2.toFixed(1) + " · 날짜 띠 " + t3.toFixed(1) + " · 기록 내용 " + t4.toFixed(1) + " · 안내 " + t5.toFixed(1) + " · 캘린더 이름 " + t7.toFixed(1) + " · 날짜순 " + t9.toFixed(1) + "/색 " + t9min.v.toFixed(1) + t9min.c + " · 알약 " + t8.toFixed(1));
    }
    // 대표색 8가지 × 밝게 · 어둡게: 대표색 위 글씨 4.5 · 바탕과 대표색 3
    tab("전체"); await W(300);
    const lookBefore = load("look", {}), badAcc = [];
    for (const mode of ["light", "dark"]) for (const c of COLORS) {
      save("look", { ...lookBefore, theme: mode, accent: c }); applyLook();
      const cs = getComputedStyle(document.documentElement), acc = rgb(cs.getPropertyValue("--accent").trim().startsWith("#") ? "rgb(" + hexRgb(cs.getPropertyValue("--accent").trim()).join(",") + ")" : cs.getPropertyValue("--accent")), on = rgb(cs.getPropertyValue("--on-accent").trim().startsWith("#") ? "rgb(" + hexRgb(cs.getPropertyValue("--on-accent").trim()).join(",") + ")" : cs.getPropertyValue("--on-accent")), card = rgb(getComputedStyle(document.body).backgroundColor);     // 칩 · 단추가 놓이는 바탕(카드보다 어두워 더 엄격)
      const t = contrast(on, acc), l = contrast(acc, card);
      if (t < 4.5 || l < 3) badAcc.push((mode === "light" ? "밝게" : "어둡게") + " " + c + " 글씨 " + t.toFixed(1) + "/선 " + l.toFixed(1));
    }
    save("look", lookBefore); applyLook();
    check("대표색 8가지 × 밝게 · 어둡게", badAcc.length === 0, badAcc.join(" · "));
    // 프로젝트 이름 글씨: 아주 옅은 색까지 띠 위 4.5
    const badProj = [];
    for (const dk of [false, true]) for (const pc of [...COLORS, "#FFEB3B", "#81D4FA", "#F8BBD0", "#FFFFFF"]) {
      const card = dk ? [41, 42, 45] : [255, 255, 255], band = card.map((v, i) => Math.round(v + (hexRgb(pc)[i] - v) * 0.15));
      const ink = rgb(headInk(pc, dk)), r = contrast(ink, band);
      if (r < 4.5) badProj.push((dk ? "어둡게 " : "밝게 ") + pc + " " + r.toFixed(1));
    }
    check("프로젝트 이름 글씨(옅은 색 포함)", badProj.length === 0, badProj.join(" · "));
    // 기록 탭 프로젝트 알약(작은 굵은 글씨, 바탕은 프로젝트 색 16%)
    const badChip = [];
    for (const dk of [false, true]) for (const pc of [...COLORS, "#FFEB3B", "#81D4FA", "#F8BBD0", "#FFFFFF"]) {
      const card = dk ? [41, 42, 45] : [255, 255, 255], band = card.map((v, i) => Math.round(v + (hexRgb(pc)[i] - v) * 0.16));
      const r = contrast(rgb(headInk(pc, dk, 0.16)), band);
      if (r < 4.5) badChip.push((dk ? "어둡게 " : "밝게 ") + pc + " " + r.toFixed(1));
    }
    check("기록 알약 글씨(옅은 색 포함)", badChip.length === 0, badChip.join(" · "));
    if (before) document.documentElement.dataset.theme = before; else delete document.documentElement.dataset.theme;
    tab("전체");
  } catch (e) { errs.push(e.message); }
  check("자바스크립트 오류 없음", errs.length === 0, errs.join(" / "));
  // 글자 크기 '아주 크게': 목록이 1.4배로 커지고, 끌 때 빈자리가 카드와 같은 높이(v93 전에는 1.4배 더 높아 놓는 곳이 어긋났다)
  try {
    const lookKeep = load("look", {}); save("look", { ...lookKeep, size: "xl" }); applyLook(); tab("전체"); await W(300);
    const it = document.querySelector(".item"), zoomOk = $("list").style.zoom === "1.4";
    let ratioOk = false, info = "";
    if (it) {
      it.scrollIntoView({ block: "center" }); await W(200);
      const r0 = it.getBoundingClientRect(), tx = it.querySelector(".text"), rr = tx.getBoundingClientRect();
      const fire = (tp, yy) => tx.dispatchEvent(new PointerEvent(tp, { bubbles: true, cancelable: true, clientX: rr.left + rr.width / 2, clientY: yy, pointerId: 1, pointerType: "touch", isPrimary: true, button: 0, buttons: tp === "pointerup" ? 0 : 1 }));
      fire("pointerdown", rr.top + rr.height / 2); await W(700);
      const sh = drag && drag.slot ? drag.slot.getBoundingClientRect().height : 0;
      fire("pointerup", rr.top + rr.height / 2); await W(500);
      ratioOk = sh > 0 && Math.abs(sh - r0.height) < 4; info = "카드 " + r0.height.toFixed(0) + " · 빈자리 " + sh.toFixed(0);
      // 제목 칸이 카드 폭의 60% 이상(마감 알약 때문에 한두 글자씩 줄바꿈되던 것)
      const narrow = [...document.querySelectorAll(".board .item .text")].filter(e => e.clientWidth - parseFloat(getComputedStyle(e).paddingRight) < e.closest(".item").clientWidth * 0.6).length;
      ratioOk = ratioOk && narrow === 0; info += " · 좁은 제목 " + narrow;
      tab("날짜순"); await W(300); const overNext = [...document.querySelectorAll("body *")].filter(e => !e.closest("#selftest") && e.getBoundingClientRect().right > innerWidth + 1).length; tab("전체"); await W(300);     // 날짜순 맨 위 지난 마감 줄(모두 오늘로 · 내일로)이 밖으로 나가던 것
      ratioOk = ratioOk && overNext === 0; info += " · 날짜순 넘침 " + overNext;
    }
    save("look", lookKeep); applyLook(); render(); await W(200);
    check("글자 아주 크게: 목록 확대 · 끌 때 빈자리 높이", zoomOk && ratioOk, info);
  } catch (e) { check("글자 아주 크게: 목록 확대 · 끌 때 빈자리 높이", false, e.message); }
  // English 화면(맨 마지막: 한국어로 돌아가려면 다시 켜야 해서). 탭 · 오늘 카드 · 마감 알약 · 날짜순 · 설정 시트에 UI 한국어가 남지 않는지(사용자 자료 칸은 빼고)
  try {
    const lookKeep = load("look", {}); save("look", { ...lookKeep, lang: "en" }); applyLook(); render(); startTr(); await W(300);
    const leftKo = new Set(), scan = () => { const tw = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, { acceptNode: n => /SCRIPT|STYLE/.test(n.parentElement?.tagName) || n.parentElement?.closest(SKIP + ", #selftest, .phrase") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT }); let n; while ((n = tw.nextNode())) if (/[가-힣]/.test(n.data.replace(/^\s*Next: .*$/, "")) && !/한국어|언어 · Language/.test(n.data)) leftKo.add(n.data.trim()); /* Next: 뒤는 단계 이름(사용자 자료) */ };
    scan(); tab("By date"); await W(300); scan(); tab("Calendar"); await W(300); scan(); tab("Log"); await W(300); scan(); tab("All"); await W(300);
    $("settings").click(); await W(300); scan(); closeSheet();
    const chipsOk = !!document.querySelector('[data-filter="all"]') && document.querySelector('[data-filter="all"]').textContent === "All" && document.querySelector('[data-filter="next"]').textContent.startsWith("By date");
    // 영어 마감 알약(1d overdue 등)이 길어 제목과 겹치지 않는지
    const pillOver = [...document.querySelectorAll(".board .item")].filter(it => { const d = it.querySelector(".meta .due"), tx = it.querySelector(".text"); if (!d || !tx || getComputedStyle(d).position !== "absolute") return false; const tr = tx.getBoundingClientRect(); return tr.left + tx.clientWidth - parseFloat(getComputedStyle(tx).paddingRight) > d.getBoundingClientRect().left + 1; }).length;
    save("look", lookKeep);
    const w1 = wordDue("Send the quote by Friday"), w2 = wordDue("Call Kim tomorrow"), w3 = wordDue("Plan the Friday party");
    const wordsOk = !!w1 && w1.text === "Send the quote" && !!w2 && w2.due === later(1) && w2.text === "Call Kim" && !w3;
    check("English 화면(탭 · 카드 · 날짜순 · 일정 · 기록 · 설정)", chipsOk && wordsOk && leftKo.size === 0 && pillOver === 0, (leftKo.size ? [...leftKo].slice(0, 4).join(" | ") : "") + " 알약 겹침 " + pillOver);
  } catch (e) { check("English 화면(탭 · 카드 · 날짜순 · 일정 · 기록 · 설정)", false, e.message); }
  const box = document.createElement("pre"); box.id = "selftest";
  box.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99;margin:0;padding:8px;font-size:11px;background:#fff;color:#000;white-space:pre-wrap";
  box.textContent = out.join("\n"); document.body.appendChild(box);
  document.title = out.some(x => x.startsWith("FAIL")) ? "SELFTEST FAIL" : "SELFTEST OK";
}

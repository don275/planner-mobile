<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#212121">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mebys Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mebys Planner</title>
<style>
  :root {
    --accent: #212121; --on-accent: #fff; --back: #f6f7f9; --card: #fff; --text: #202124; --sub: #5f6368; --faint: #80868b;
    --line: #dee1e6; --red: #d93025; --orange: #e37400; --green: #188048; --tint: #ececec; --shade: rgba(0,0,0,.32);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --accent: #e8eaed; --on-accent: #202124; --back: #202124; --card: #292a2d; --text: #e8eaed; --sub: #aaafb5; --faint: #8a9096;
      --line: #46494d; --red: #f28b82; --orange: #faad5a; --green: #5ec489; --tint: #3c4043; --shade: rgba(0,0,0,.55); }
  }
  :root[data-theme="dark"] { --accent: #e8eaed; --on-accent: #202124; --back: #202124; --card: #292a2d; --text: #e8eaed; --sub: #aaafb5; --faint: #8a9096;
      --line: #46494d; --red: #f28b82; --orange: #faad5a; --green: #5ec489; --tint: #3c4043; --shade: rgba(0,0,0,.55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--back); color: var(--text); font: 15px/1.45 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  body { padding-bottom: calc(132px + var(--ad, 0px) + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--back); padding: calc(10px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
  .top { display: flex; align-items: center; gap: 8px; }
  h1 { font-size: 18px; margin: 0; flex: none; white-space: nowrap; }
  .state { flex: 1; min-width: 0; text-align: right; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .chips { display: flex; gap: 6px; margin-top: 8px; }
  .chip { border-radius: 999px; padding: 4px 13px; font-size: 13px; }
  .chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .banner { margin: 10px 16px 0; padding: 9px 12px; border-radius: 10px; background: var(--tint); color: var(--sub); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  .banner span { flex: 1; }
  main { padding: 4px 16px 0; }
  section { margin-top: 14px; }
  .proj { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--tint); font-weight: 700; }
  .proj i { width: 4px; height: 18px; border-radius: 2px; background: var(--accent); flex: none; }
  .proj b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj small { font-weight: 400; color: var(--sub); }
  .item { display: flex; gap: 10px; padding: 11px 4px 10px; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .box { flex: none; width: 24px; height: 24px; margin-top: 1px; border: 1.6px solid var(--faint); border-radius: 7px; background: var(--card); padding: 0; position: relative; }
  .box.part::after { content: ""; position: absolute; inset: 6px; border-radius: 2px; background: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .text { word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; font-size: 12.5px; color: var(--sub); }
  .due { font-weight: 700; }
  .due.late { color: var(--red); } .due.soon { color: var(--orange); } .due.far { color: var(--sub); font-weight: 400; }
  .more { margin-top: 8px; padding: 10px; border-radius: 10px; background: var(--tint); font-size: 13.5px; color: var(--sub); }
  .steps { margin: 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .steps li span { flex: 1; min-width: 0; word-break: break-word; }
  .steps li.done span { text-decoration: line-through; color: var(--faint); }
  .steps li.now span { color: var(--text); font-weight: 700; }
  .steps li button, .acts button { font-size: 12.5px; padding: 3px 9px; border-radius: 999px; }
  .note { white-space: pre-wrap; margin-top: 8px; color: var(--text); }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .empty { text-align: center; color: var(--faint); padding: 48px 0; }
  footer { position: fixed; left: 0; right: 0; bottom: var(--ad, 0px); background: var(--back); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .row { display: flex; gap: 8px; }
  .row + .row { margin-top: 8px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  #newText { flex: 1; } #newSection { flex: 1; } #newDue { flex: none; width: 138px; }
  .toast { position: fixed; z-index: 30; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--accent); color: var(--on-accent); padding: 9px 14px; border-radius: 999px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; white-space: nowrap; }
  .toast button { background: transparent; border: 0; color: inherit; font-weight: 700; padding: 0; text-decoration: underline; }
  .shade { position: fixed; left: 0; right: 0; top: 0; height: 100%; z-index: 20; background: var(--shade); display: flex; align-items: flex-end; overscroll-behavior: contain; }
  .sheet { width: 100%; max-height: 88%; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; background: var(--back); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .row input { flex: 1; width: auto; }
  .have { margin: 0 0 10px; padding: 0; list-style: none; font-size: 14px; color: var(--sub); }
  .have li { padding: 3px 0; }
  .have li.new { color: var(--text); font-weight: 700; }
  .sheet h2 { font-size: 16px; margin: 0 0 12px; }
  .sheet textarea, .sheet input { width: 100%; }
  .sheet label { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  .sheet .end { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .phrase { display: block; width: 100%; text-align: left; margin-bottom: 8px; padding: 10px 12px; }
  .phrase small { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #picker { position: fixed; left: -100px; top: 0; width: 1px; height: 1px; opacity: 0; }
  .day { margin: 16px 0 6px; font-size: 13px; font-weight: 700; color: var(--sub); }
  .ev { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ev .when { flex: none; width: 46px; font-size: 13px; color: var(--sub); padding-top: 1px; }
  .ev .bar { flex: none; width: 4px; align-self: stretch; border-radius: 2px; background: var(--accent); }
  .ev .what { flex: 1; min-width: 0; word-break: break-word; }
  .ev small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
  body.plain { padding-bottom: calc(24px + var(--ad, 0px) + env(safe-area-inset-bottom)); }
  body.plain footer { display: none; }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; }
  .swatches button { width: 34px; height: 34px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .swatches button.on { border-color: var(--text); box-shadow: inset 0 0 0 2px var(--back); }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border-radius: 999px; padding: 6px 14px; }
  .seg button.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .sheet a { color: var(--sub); }
  .find { display: flex; gap: 8px; margin-top: 8px; }
  .find input { flex: 1; }
  mark { background: #ffe082; color: #202124; border-radius: 3px; padding: 0 1px; }
  .item, .proj, .steps li { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .dragsrc { opacity: .3; }
  .ghost { position: fixed; z-index: 40; left: 14px; right: 14px; pointer-events: none; background: var(--card); color: var(--text); border: 1.5px solid var(--accent); border-radius: 12px;
    padding: 11px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.28); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: scale(1.02); }
  .dropline { position: fixed; z-index: 39; left: 16px; right: 16px; height: 3px; border-radius: 2px; background: var(--accent); pointer-events: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Mebys Planner</h1>
    <span class="state" id="state"></span>
    <button id="search" aria-label="검색">검색</button>
    <button id="phrases">문구</button>
    <button id="settings" aria-label="설정">설정</button>
  </div>
  <div class="find" id="findBar" hidden><input id="findText" type="search" placeholder="찾을 말" enterkeyhint="search" autocomplete="off"><button id="findClose">닫기</button></div>
  <div class="chips">
    <button class="chip on" data-filter="all">전체</button>
    <button class="chip" data-filter="today">오늘</button>
    <button class="chip" data-filter="events">일정</button>
    <button class="chip" data-filter="logs">기록</button>
  </div>
</header>
<div class="banner" id="banner" hidden><span id="bannerText"></span><button class="primary" id="connect">구글 연결</button></div>
<main id="list"></main>
<footer>
  <div class="row">
    <input id="newText" placeholder="할 일 추가" enterkeyhint="done" autocomplete="off">
    <button class="primary" id="add">추가</button>
  </div>
  <div class="row">
    <select id="newSection" aria-label="프로젝트"></select>
    <input id="newDue" type="date" aria-label="마감일">
  </div>
</footer>
<input id="picker" type="date" aria-hidden="true" tabindex="-1">
<div class="toast" id="toast" hidden><span id="toastText"></span><button id="undo">되돌리기</button></div>
<div class="shade" id="shade" hidden><div class="sheet" id="sheet"></div></div>

<script>
// ───── 설정: 구글 웹 클라이언트 ID. 비어 있으면 견본 자료로만 돈다. ─────
const CLIENT_ID = "912022312060-10gaphh68u5fqdnmmoqdncu5d429g3uf.apps.googleusercontent.com";
const SCOPE = "https://www.googleapis.com/auth/drive.appdata";
const STATE_FILE = "planner-state.json";     // PC 가 올리는 현재 목록
const INBOX_FILE = "planner-inbox.json";     // 폰에서 한 일. PC 가 가져가서 반영한다
// 앱(아이폰 · 안드로이드)으로 감쌌을 때: 앱이 window.PlannerNative = { signIn(), copy(text) } 를 넣어 주면 그걸 쓴다.
const native = () => window.PlannerNative || null;
// 앱이 광고 띠를 띄우거나 없앨 때 부른다(광고 제거를 사면 0). 웹 화면에는 광고가 없다.
window.plannerSetAdHeight = px => document.documentElement.style.setProperty("--ad", (Number(px) || 0) + "px");

const $ = id => document.getElementById(id);
const day = d => d.toISOString().slice(0, 10);
const today = () => day(new Date(Date.now() - new Date().getTimezoneOffset() * 60000));
const md = s => s ? Number(s.slice(5, 7)) + "/" + Number(s.slice(8, 10)) : "";
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const newKey = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

let state = load("state", null);          // PC 에서 받은 목록
let inbox = load("inbox", []);            // 아직 PC 가 가져가지 않은 내 변경
let filter = "all", opened = null, token = null, picked = false, problem = "", query = "";
// 찾기: 띄어 쓴 말이 모두 들어 있는 것만 남긴다
const words = () => query.toLowerCase().split(/\s+/).filter(Boolean);
const hits = (...texts) => { const all = texts.join("\n").toLowerCase(); return words().every(w => all.includes(w)); };
const mark = s => { let out = esc(s); for (const w of words()) out = out.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => "<mark>" + m + "</mark>"); return out; };
let demo = (!CLIENT_ID && !native()) || new URLSearchParams(location.search).has("demo");   // ?demo 를 붙이면 견본 자료로만 돈다(시험용)

function sample() {
  const t = today(), plus = n => day(new Date(Date.parse(t) + n * 86400000));
  return { updated: new Date().toISOString(), sections: ["매일 하는 일", "가을 행사", "거래처"], pinned: ["매일 하는 일"],
    colors: { "가을 행사": "#8E24AA", "거래처": "#00897B" },
    events: [{ title: "주간 회의", allDay: false, start: t + "T10:30", end: t + "T11:30", last: t, calendar: "업무", color: "#1A73E8" },
             { title: "가을 행사 준비 기간", allDay: true, start: plus(1) + "T00:00", end: plus(4) + "T00:00", last: plus(3), calendar: "행사", color: "#8E24AA" },
             { title: "거래처 미팅", allDay: false, start: plus(2) + "T15:00", end: plus(2) + "T16:00", last: plus(2), calendar: "", color: "" }],
    logs: [{ date: t, section: "매일 하는 일", title: "주문 확인" }, { date: plus(-1), section: "가을 행사", title: "장소 확정" }, { date: plus(-1), section: "거래처", title: "견적서 발송" }],
    phrases: [{ name: "입고지 안내", text: "입고지 정보 전달드립니다!\n\n입고지: (주소)\n담당자: (이름)\n연락처: (번호)" },
              { name: "출고일 안내", text: "{업체명} 담당자님, 안녕하세요.\n{상품명} 출고일은 {출고일}입니다." }],
    todos: [
    { id: "s1", section: "매일 하는 일", text: "주문 확인 → 출고 요청", steps: ["주문 확인", "출고 요청"], step: 0, due: t, stepDues: [], notes: "", repeat: true },
    { id: "s2", section: "매일 하는 일", text: "문의 메일 답장", steps: ["문의 메일 답장"], step: 0, due: t, stepDues: [], notes: "", repeat: true },
    { id: "s3", section: "가을 행사", text: "장소 확정 → 안내문 작성 → 참석자에게 발송", steps: ["장소 확정", "안내문 작성", "참석자에게 발송"], step: 1, due: plus(2), stepDues: [plus(-1), plus(2), plus(7)], notes: "작년 안내문 참고\n참석 예정 40명", repeat: false },
    { id: "s4", section: "가을 행사", text: "인쇄물 견적 받기", steps: ["인쇄물 견적 받기"], step: 0, due: "", stepDues: [], notes: "", repeat: false },
    { id: "s5", section: "거래처", text: "계약서 수정 사항 확인", steps: ["계약서 수정 사항 확인"], step: 0, due: plus(-1), stepDues: [], notes: "", repeat: false },
    { id: "s6", section: "거래처", text: "대표님 검토 → 전자 계약 발송", steps: ["대표님 검토", "전자 계약 발송"], step: 0, due: plus(9), stepDues: [], notes: "", repeat: false } ] };
}

// PC 에서 받은 목록에 아직 안 넘어간 내 변경을 겹쳐서 보여 준다(PC 와 같은 규칙으로).
function view() {
  const todos = (state ? state.todos : []).map(x => ({ ...x, steps: [...(x.steps || [x.text])], stepDues: [...(x.stepDues || [])] }));
  const sync = item => { if (item.stepDues.some(Boolean)) item.due = item.stepDues[Math.min(item.step, item.stepDues.length - 1)] || ""; };
  for (const op of inbox) {
    if (op.op === "rename") { todos.forEach(x => { if ((x.section || "") === op.from) x.section = op.to; }); continue; }
    if (op.op === "add") { todos.push({ id: op.id, section: op.section, text: op.text, steps: [op.text], step: 0, due: op.due || "", stepDues: [], notes: "" }); continue; }
    if (op.op === "move") {
      const from = todos.findIndex(x => x.id === op.id);
      if (from < 0 || op.before === op.id) continue;
      const [it] = todos.splice(from, 1); it.section = op.section;
      let at = op.before ? todos.findIndex(x => x.id === op.before) : -1;
      if (at < 0) { at = todos.length; for (let k = todos.length - 1; k >= 0; k--) if ((todos[k].section || "") === op.section) { at = k + 1; break; } }
      todos.splice(at, 0, it); continue;
    }
    if (op.op === "moveSection") continue;
    const item = todos.find(x => x.id === op.id);
    if (!item) continue;
    if (op.op === "check") { if (item.step < item.steps.length - 1) { item.step++; sync(item); } else item.gone = true; }
    if (op.op === "back" && item.step > 0) { item.step--; sync(item); }
    if (op.op === "note") item.notes = item.notes ? item.notes.trimEnd() + "\n" + op.text : op.text;
    if (op.op === "edit" && item.steps.length < 2) { item.text = op.text; item.steps = [op.text]; }
    if (op.op === "editStep" && op.step < item.steps.length) item.steps[op.step] = op.text;
    if (op.op === "delete") item.gone = true;
    if (op.op === "addStep") { item.steps.push(op.text); if (item.stepDues.some(Boolean)) item.stepDues.push(""); }
    if (op.op === "moveStep" && op.from < item.steps.length && op.to < item.steps.length) {
      const [s] = item.steps.splice(op.from, 1); item.steps.splice(op.to, 0, s);
      if (item.stepDues.some(Boolean)) { while (item.stepDues.length < item.steps.length) item.stepDues.push(""); const [d] = item.stepDues.splice(op.from, 1); item.stepDues.splice(op.to, 0, d); sync(item); }
      item.text = item.steps.join(" → ");
    }
    if (op.op === "due") {
      const many = item.steps.length > 1;
      if (many && op.step != null) { while (item.stepDues.length < item.steps.length) item.stepDues.push(""); item.stepDues[op.step] = op.due; sync(item); if (!item.stepDues.some(Boolean)) { item.stepDues = []; item.due = ""; } }
      else if (item.stepDues.some(Boolean)) { item.stepDues[Math.min(item.step, item.stepDues.length - 1)] = op.due; sync(item); }
      else item.due = op.due;
    }
  }
  return todos.filter(x => !x.gone);
}

// 프로젝트 순서: PC 가 보낸 순서에 아직 안 넘어간 이름 바꾸기 · 순서 바꾸기를 겹친다.
function sectionOrder() {
  let secs = [...((state && state.sections) || [])];
  for (const op of inbox) {
    if (op.op === "rename") secs = secs.map(s => s === op.from ? op.to : s);
    if (op.op === "moveSection" && secs.includes(op.name)) {
      secs = secs.filter(s => s !== op.name);
      const at = op.end === "1" ? -1 : secs.indexOf(op.before);
      if (at < 0) secs.push(op.name); else secs.splice(at, 0, op.name);
    }
  }
  return secs;
}

function dueLabel(item) {
  if (!item.due) return item.repeat ? { text: "반복", cls: "far" } : null;
  const left = Math.round((Date.parse(item.due) - Date.parse(today())) / 86400000);
  const when = left === 0 ? "오늘" : left > 0 ? "D-" + left : (-left) + "일 지남";
  return { text: item.repeat ? "반복 · " + when : md(item.due) + " (" + when + ")", cls: left <= 0 ? "late" : left <= 3 ? "soon" : "far" };
}

const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const dayTitle = s => { const d = new Date(s + "T00:00"); return (d.getMonth() + 1) + "/" + d.getDate() + " (" + WEEK[d.getDay()] + ")" + (s === today() ? " · 오늘" : ""); };

// 오늘부터 2주 일정(PC 의 구글 캘린더에서 온 것)
function eventsHtml() {
  const list = ((state && state.events) || []).filter(ev => !query || hits(ev.title || "", ev.calendar || ""));
  if (!list.length) return `<div class="empty">${query ? "찾는 일정이 없습니다" : "앞으로 2주 동안 일정이 없습니다"}</div>`;
  const days = {};
  for (const ev of list) {
    const first = ev.start.slice(0, 10) < today() ? today() : ev.start.slice(0, 10);
    (days[first] = days[first] || []).push(ev);
  }
  return Object.keys(days).sort().map(d => `<div class="day">${dayTitle(d)}</div>` + days[d].map(ev => {
    const when = ev.allDay || ev.start.slice(0, 10) < d ? "종일" : ev.start.slice(11, 16);
    const until = ev.last > d ? " · ~" + md(ev.last) : "";
    return `<div class="ev"><span class="when">${when}</span><span class="bar" style="${ev.color ? "background:" + esc(ev.color) : ""}"></span>`
      + `<span class="what">${mark(ev.title || "(제목 없음)")}<small>${esc(ev.calendar || "")}${until}</small></span></div>`;
  }).join("")).join("");
}

// 최근 2주 동안 끝낸 일
function logsHtml() {
  const list = ((state && state.logs) || []).filter(log => !query || hits(log.title || "", log.section || ""));
  if (!list.length) return `<div class="empty">${query ? "찾는 기록이 없습니다" : "최근 2주 동안 끝낸 일이 없습니다"}</div>`;
  const days = {};
  for (const log of list) (days[log.date] = days[log.date] || []).push(log);
  return Object.keys(days).sort().reverse().map(d => `<div class="day">${dayTitle(d)} · ${days[d].length}건</div>` + days[d].map(log =>
    `<div class="ev"><span class="what">${mark(log.title)}<small>${esc(log.section || "")}</small></span></div>`).join("")).join("");
}

function render() {
  if (drag) return;     // 끄는 중에는 다시 그리지 않는다(놓은 뒤 그린다)
  document.body.classList.toggle("plain", filter === "events" || filter === "logs");
  if (filter === "events" || filter === "logs") {
    $("list").innerHTML = filter === "events" ? eventsHtml() : logsHtml();
    $("state").textContent = problem;
    $("banner").hidden = !demo && !!token;
    $("bannerText").textContent = demo ? "견본 자료입니다" : "구글에 연결하면 내 할 일이 보입니다";
    $("connect").hidden = demo;
    return;
  }
  const todos = view().filter(x => (filter === "all" || (x.due && x.due <= today())) && (!query || hits(x.section || "", x.steps.join(" "), x.notes || "")));
  const order = [...new Set([...sectionOrder(), ...todos.map(x => x.section || "")])];
  const colors = (state && state.colors) || {}, pinned = (state && state.pinned) || [];
  let html = "";
  for (const name of order) {
    const items = todos.filter(x => (x.section || "") === name);
    if (!items.length) continue;
    html += `<section><div class="proj" data-sec="${esc(name)}"><i style="${colors[name] ? "background:" + esc(colors[name]) : ""}"></i><b data-project="${esc(name)}">${esc(name || "기타")}</b>`
      + (pinned.includes(name) ? `<small>고정</small>` : "") + `<small>${items.length}</small></div>`;
    for (const item of items) {
      const due = dueLabel(item), many = item.steps.length > 1;
      html += `<div class="item" data-id="${esc(item.id)}" data-sec="${esc(item.section || "")}"><button class="box${item.step > 0 ? " part" : ""}" data-check="${esc(item.id)}" aria-label="완료"></button><div class="body">`
        + `<div class="text" data-open="${esc(item.id)}">${mark(many ? item.steps[item.step] : item.text)}</div><div class="meta" data-open="${esc(item.id)}">`
        + (many ? `<span>${item.step + 1}/${item.steps.length}</span>` + (item.step < item.steps.length - 1 ? `<span>다음: ${esc(item.steps[item.step + 1])}</span>` : "") : "")
        + (due ? `<span class="due ${due.cls}">${due.text}</span>` : "") + (item.notes && opened !== item.id ? `<span>메모</span>` : "") + `</div>`;
      if (opened === item.id) {
        html += `<div class="more">`;
        if (many) html += `<ul class="steps" data-steps="${esc(item.id)}">` + item.steps.map((s, i) => `<li class="${i < item.step ? "done" : i === item.step ? "now" : ""}"${i >= item.step ? ` data-stepi="${i}"` : ""}><span data-stepname="${i}">${i + 1}. ${esc(s)}</span>`
          + (i >= item.step ? `<button data-stepdue="${i}">${item.stepDues[i] ? "~" + md(item.stepDues[i]) : "마감일"}</button>` : "") + `</li>`).join("") + `</ul>`;
        if (item.notes) html += `<div class="note">${esc(item.notes)}</div>`;
        html += `<div class="acts">` + (item.step > 0 ? `<button data-act="back">이전 단계</button>` : "")
          + `<button data-act="step">단계 추가</button><button data-act="note">메모 추가</button>`
          + (many ? "" : `<button data-act="edit">수정</button>`) + `<button data-act="delete">삭제</button>`
          + (many ? "" : `<button data-act="due">${item.due ? "마감 " + md(item.due) : "마감일"}</button>`) + `</div></div>`;
      }
      html += `</div></div>`;
    }
    html += `</section>`;
  }
  $("list").innerHTML = html || `<div class="empty">${query ? "찾는 할 일이 없습니다" : filter === "today" ? "오늘 마감인 일이 없습니다" : "남은 일이 없습니다"}</div>`;
  const names = order.filter(Boolean), sel = $("newSection"), keep = sel.value;
  sel.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join("") + `<option value="">기타</option>`;
  if (picked && (names.includes(keep) || keep === "")) sel.value = keep;
  $("state").textContent = problem;
  $("banner").hidden = !demo && !!token;
  $("bannerText").textContent = demo ? "견본 자료입니다" : "구글에 연결하면 내 할 일이 보입니다";
  $("connect").hidden = demo;
  // 앱으로 감쌌을 때: 앱이 마감일 알림을 걸 수 있게 지금 목록을 넘겨준다.
  try { window.PlannerNative?.onItems?.(view()); } catch {}
}

let toastTimer = null, lastOp = null;
function toast(text, op) {
  lastOp = op || null;
  $("toastText").textContent = text; $("undo").hidden = !op; $("toast").hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").hidden = true, 4000);
}

function push(op, said) { op.key = op.key || newKey(); op.at = new Date().toISOString(); inbox.push(op); save("inbox", inbox); render(); send(); if (said) toast(said, op); }

function check(id) {
  const item = view().find(x => x.id === id);
  if (!item) return;
  const last = item.step >= item.steps.length - 1;
  push({ op: "check", id }, last ? "완료했습니다" : "'" + item.steps[item.step] + "' 완료");
}

function add() {
  const text = $("newText").value.replace(/　/g, " ").trim();
  if (!text) { $("newText").focus(); return; }
  const id = "m" + newKey();
  $("newText").value = ""; const due = $("newDue").value; $("newDue").value = "";
  push({ op: "add", id, key: id, section: $("newSection").value, text, due }, "추가했습니다");
}

// ───── 아래에서 올라오는 작은 창(글 쓰기 · 문구 고르기 · 빈칸 채우기) ─────
// 창이 떠 있는 동안 뒤 목록은 움직이지 않게 묶고, 창은 키보드 위 보이는 자리에 맞춘다.
let lockY = 0;
function lockScroll(on) {
  const b = document.body.style;
  if (on && b.position !== "fixed") { lockY = scrollY; b.position = "fixed"; b.top = -lockY + "px"; b.left = "0"; b.right = "0"; }
  if (!on && b.position === "fixed") { b.position = ""; b.top = ""; b.left = ""; b.right = ""; scrollTo(0, lockY); }
}
function fitShade() {
  const vv = window.visualViewport, s = $("shade");
  if (!vv || s.hidden) return;
  s.style.top = vv.offsetTop + "px"; s.style.height = vv.height + "px";
}
if (window.visualViewport) { visualViewport.addEventListener("resize", fitShade); visualViewport.addEventListener("scroll", fitShade); }
function sheet(html, ready) {
  $("sheet").innerHTML = html; $("shade").hidden = false;
  lockScroll(true); fitShade();
  if (ready) ready($("sheet"));
}
function closeSheet() { $("shade").hidden = true; $("sheet").innerHTML = ""; $("shade").style.top = ""; $("shade").style.height = ""; lockScroll(false); }

// 단계 추가: 창을 닫지 않고 여러 개를 이어서 넣는다.
function addSteps(id) {
  let added = 0;
  const draw = s => {
    const item = view().find(x => x.id === id);
    if (!item) return;
    const old = item.steps.length - added;
    s.querySelector("#have").innerHTML = item.steps.map((n, i) => `<li class="${i >= old ? "new" : ""}">${i + 1}. ${esc(n)}</li>`).join("");
  };
  sheet(`<h2>단계 추가</h2><ul class="have" id="have"></ul>
    <div class="row"><input id="stepText" placeholder="맨 끝에 붙일 단계" enterkeyhint="enter" autocomplete="off"><button class="primary" id="stepAdd">추가</button></div>
    <div class="end"><button id="stepDone">완료</button></div>`, s => {
    const box = s.querySelector("#stepText");
    draw(s); setTimeout(() => box.focus(), 50);
    const go = () => {
      const v = box.value.replace(/　/g, " ").replace(/→|->/g, " ").trim();
      if (!v) { box.focus(); return; }
      push({ op: "addStep", id, text: v }); added++;
      box.value = ""; draw(s); box.focus();
      const have = s.querySelector("#have"); have.lastElementChild && have.lastElementChild.scrollIntoView({ block: "nearest" });
    };
    s.querySelector("#stepAdd").onclick = go;
    box.addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); go(); } });
    s.querySelector("#stepDone").onclick = () => { closeSheet(); if (added) toast(added + "개 단계를 넣었습니다"); };
  });
}
function ask(title, placeholder, done, value) {
  sheet(`<h2>${esc(title)}</h2><textarea id="askText" rows="3" placeholder="${esc(placeholder)}">${esc(value || "")}</textarea>
    <div class="end"><button data-close>취소</button><button class="primary" id="askOk">저장</button></div>`, s => {
    const box = s.querySelector("#askText"); setTimeout(() => box.focus(), 50);
    s.querySelector("#askOk").onclick = () => { const v = box.value.replace(/　/g, " ").trim(); if (!v) { box.focus(); return; } closeSheet(); done(v); };
  });
}

// 날짜 고르기: 숨겨 둔 날짜 칸을 연다. 고른 날이 없으면(지우기) 빈 값.
function pickDate(current, done) {
  const p = $("picker");
  p.value = current || "";
  p.onchange = () => { done(p.value || ""); p.onchange = null; };
  try { p.showPicker(); } catch { const v = prompt("마감일 (예: " + today() + ", 비우면 지움)", current || ""); if (v !== null && (v === "" || /^\d{4}-\d{2}-\d{2}$/.test(v))) done(v); }
}

// ───── 설정(이 폰에만 저장) ─────
const COLORS = ["#212121", "#1A73E8", "#00897B", "#188038", "#E37400", "#D93025", "#8E24AA", "#5F6368"];
function onAccent(hex) { const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (r * 299 + g * 587 + b * 114) / 1000 > 150 ? "#202124" : "#ffffff"; }
function applyLook() {
  const look = load("look", {}), root = document.documentElement;
  if (look.theme === "light" || look.theme === "dark") root.dataset.theme = look.theme; else delete root.dataset.theme;
  const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  if (look.accent) { root.style.setProperty("--accent", look.accent); root.style.setProperty("--on-accent", onAccent(look.accent)); }
  else { root.style.removeProperty("--accent"); root.style.removeProperty("--on-accent"); }
  // 아주 어두운 대표색은 어두운 화면에서 안 보이므로 밝게 바꾼다
  if (dark && look.accent && onAccent(look.accent) === "#ffffff" && look.accent === "#212121") { root.style.removeProperty("--accent"); root.style.removeProperty("--on-accent"); }
  document.body.style.fontSize = ({ small: "14px", large: "17px" })[look.size] || "";
}
function showSettings() {
  const look = load("look", {});
  const seg = (key, items) => `<div class="seg">` + items.map(([v, t]) => `<button data-look="${key}" data-value="${v}" class="${(look[key] || "") === v ? "on" : ""}">${t}</button>`).join("") + `</div>`;
  sheet(`<h2>설정</h2>
    <label>대표색</label><div class="swatches">` + COLORS.map(c => `<button data-look="accent" data-value="${c}" class="${(look.accent || "#212121") === c ? "on" : ""}" style="background:${c}" aria-label="${c}"></button>`).join("") + `</div>
    <label>화면</label>` + seg("theme", [["", "기기 설정"], ["light", "밝게"], ["dark", "어둡게"]]) + `
    <label>글자 크기</label>` + seg("size", [["small", "작게"], ["", "보통"], ["large", "크게"]]) + `
    <label>구글</label><div class="seg">` + (token ? `<button id="signOut">연결 해제</button>` : `<button id="signIn">구글 연결</button>`) + `</div>
    <label><a href="about.html">앱 소개</a> · <a href="privacy.html">개인정보처리방침</a></label>
    <div class="end"><button class="primary" data-close>닫기</button></div>`, s => {
    s.querySelectorAll("[data-look]").forEach(b => b.onclick = () => {
      const now = load("look", {}); now[b.dataset.look] = b.dataset.value; if (!b.dataset.value) delete now[b.dataset.look];
      save("look", now); applyLook(); showSettings();
    });
    const out = s.querySelector("#signOut");
    if (out) out.onclick = () => { try { if (window.google && token) google.accounts.oauth2.revoke(token, () => {}); } catch {} token = null; save("connected", false); closeSheet(); render(); };
    const inn = s.querySelector("#signIn");
    if (inn) inn.onclick = () => { closeSheet(); connect(); };
  });
}

// ───── 문구 ─────
async function copy(text) {
  try { if (native() && native().copy) { await native().copy(text); return true; } } catch {}
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
  const ok = document.execCommand("copy"); t.remove(); return ok;
}
function blanks(text) { return [...new Set([...(text || "").matchAll(/\{([^{}\n]{1,30})\}/g)].map(m => m[1].trim()).filter(Boolean))]; }
function showPhrases() {
  const list = (state && state.phrases) || [];
  if (!list.length) { sheet(`<h2>문구</h2><div class="empty">저장한 문구가 없습니다. PC 앱의 [문구 ▾ › 문구 관리]에서 만들면 여기 보입니다.</div><div class="end"><button data-close>닫기</button></div>`); return; }
  sheet(`<h2>문구</h2>` + list.map((p, i) => `<button class="phrase" data-phrase="${i}">${esc(p.name)}<small>${esc(p.text.replace(/\n+/g, " "))}</small></button>`).join("")
    + `<div class="end"><button data-close>닫기</button></div>`);
}
function usePhrase(p) {
  const names = blanks(p.text);
  const finish = async text => { closeSheet(); toast(await copy(text) ? "'" + p.name + "' 복사했습니다" : "복사하지 못했습니다"); };
  if (!names.length) { finish(p.text); return; }
  sheet(`<h2>${esc(p.name)}</h2>` + names.map((n, i) => `<label>${esc(n)}</label><input data-blank="${i}" autocomplete="off">`).join("")
    + `<div class="end"><button data-close>취소</button><button class="primary" id="fillOk">복사</button></div>`, s => {
    setTimeout(() => s.querySelector("[data-blank]").focus(), 50);
    s.querySelector("#fillOk").onclick = () => {
      const values = {}; names.forEach((n, i) => values[n] = s.querySelector(`[data-blank="${i}"]`).value.trim());
      finish(p.text.replace(/\{([^{}\n]{1,30})\}/g, (m, n) => values[n.trim()] ?? m));
    };
  });
}

// ───── 구글 드라이브(앱 전용 숨김 폴더) ─────
async function api(path, options) {
  const res = await fetch("https://www.googleapis.com/" + path, { ...options, headers: { Authorization: "Bearer " + token, ...((options || {}).headers || {}) } });
  if (res.status === 401) { token = null; throw new Error("auth"); }
  if (!res.ok) throw new Error("구글 응답 " + res.status);
  return res;
}
async function findFile(name) {
  const res = await api("drive/v3/files?spaces=appDataFolder&fields=files(id,name)&q=" + encodeURIComponent("name='" + name + "'"));
  return ((await res.json()).files || [])[0] || null;
}
async function readFile(name) {
  const file = await findFile(name);
  return file ? (await api("drive/v3/files/" + file.id + "?alt=media")).json() : null;
}
async function writeFile(name, value) {
  const file = await findFile(name), body = JSON.stringify(value);
  if (file) return api("upload/drive/v3/files/" + file.id + "?uploadType=media", { method: "PATCH", headers: { "Content-Type": "application/json" }, body });
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({ name, parents: ["appDataFolder"] })], { type: "application/json" }));
  form.append("file", new Blob([body], { type: "application/json" }));
  return api("upload/drive/v3/files?uploadType=multipart", { method: "POST", body: form });
}

let busy = false;
async function send() {
  if (demo || !token || busy) return;
  busy = true;
  try { await writeFile(INBOX_FILE, { ops: inbox }); problem = ""; } catch (e) { problem = "연결 안 됨"; }
  busy = false;
  render();
}
async function refresh() {
  if (demo) { if (!state) { state = sample(); save("state", state); } render(); return; }
  if (!token && native()) { try { token = await native().signIn(); } catch {} }
  if (!token) { render(); return; }
  try {
    const fresh = await readFile(STATE_FILE);
    if (fresh) {
      // PC 가 반영을 끝낸 변경은 목록에 이미 들어 있으므로 내 대기 목록에서 뺀다.
      const taken = new Set(fresh.applied || []);
      inbox = inbox.filter(op => !taken.has(op.key));
      state = fresh; save("state", state); save("inbox", inbox);
    }
    problem = "";
    render();
    await send();
  } catch (e) { problem = "연결 안 됨"; render(); }
}
let tokenClient = null;
function getToken(quiet) {
  if (!window.google) return false;
  if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPE, callback: r => {
    if (r.access_token) { token = r.access_token; save("connected", true); refresh(); }
  } });
  tokenClient.requestAccessToken(quiet ? { prompt: "" } : {});
  return true;
}
async function connect() {
  if (native()) { try { token = await native().signIn(); refresh(); } catch { toast("구글 연결을 하지 못했습니다"); } return; }
  if (!getToken(false)) toast("구글 연결 준비 중입니다. 잠시 뒤 다시 눌러 주세요");
}
// 구글 로그인은 1시간쯤 지나면 풀린다. 한 번 연결한 적이 있으면 화면을 누를 때 조용히 다시 받는다(창이 잠깐 떴다 닫힐 수 있다).
document.addEventListener("pointerdown", () => {
  if (demo || native() || token || !load("connected", false)) return;
  getToken(true);
}, true);

// ───── 꾹 눌러 끌어서 순서 바꾸기(할 일 · 단계 · 프로젝트) ─────
let drag = null, holdTimer = null, holdStart = null, suppressClick = false, lastY = 0, scrollTick = null;
function dragKind(el) {
  if (el.closest("button, input, select, textarea, a")) return null;
  const li = el.closest(".steps li[data-stepi]"); if (li) return { kind: "step", el: li };
  const item = el.closest(".item"); if (item) return { kind: "item", el: item };
  const proj = el.closest(".proj"); if (proj) return { kind: "proj", el: proj };
  return null;
}
function candidates() {
  if (drag.kind === "step") return [...drag.el.parentElement.querySelectorAll("li[data-stepi]")].filter(x => x !== drag.el);
  if (drag.kind === "proj") return [...$("list").querySelectorAll(".proj")].filter(x => x !== drag.el);
  return [...$("list").querySelectorAll(".item, .proj")].filter(x => x !== drag.el);
}
// 손가락 위치에서 놓일 자리: 그 위치보다 아래쪽 반에 걸친 첫 칸의 앞
function findDrop(y) {
  const list = candidates();
  let before = null;
  for (const c of list) { const r = c.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = c; break; } }
  const last = list[list.length - 1];
  const lineY = before ? before.getBoundingClientRect().top - 2 : last ? last.getBoundingClientRect().bottom + 1 : drag.el.getBoundingClientRect().bottom;
  return { before, lineY };
}
function beginDrag(t, y) {
  holdTimer = null;
  if (query || (filter !== "all" && filter !== "today")) return;
  drag = { ...t, target: null };
  const label = t.kind === "step" ? t.el.querySelector("span").textContent : t.kind === "proj" ? t.el.querySelector("b").textContent : t.el.querySelector(".text").textContent;
  drag.ghost = document.createElement("div"); drag.ghost.className = "ghost"; drag.ghost.textContent = label; document.body.appendChild(drag.ghost);
  drag.line = document.createElement("div"); drag.line.className = "dropline"; document.body.appendChild(drag.line);
  t.el.classList.add("dragsrc");
  // 집을 때 진동: 앱이면 앱의 진동(아이폰 포함), 아니면 브라우저 진동(안드로이드)
  try { if (native() && native().haptic) native().haptic(); else if (navigator.vibrate) navigator.vibrate(12); } catch {}
  moveDrag(y);
  // 화면 위 · 아래 끝에 가까우면 천천히 민다
  scrollTick = setInterval(() => {
    if (!drag) return;
    const edge = document.querySelector("header").getBoundingClientRect().bottom + 36;
    const foot = document.querySelector("footer"), bottom = (foot && getComputedStyle(foot).display !== "none" ? foot.getBoundingClientRect().top : innerHeight) - 36;
    if (lastY < edge) scrollBy(0, -Math.ceil((edge - lastY) / 6)); else if (lastY > bottom) scrollBy(0, Math.ceil((lastY - bottom) / 6)); else return;
    moveDrag(lastY);
  }, 30);
}
function moveDrag(y) {
  lastY = y;
  drag.ghost.style.top = (y - 72) + "px";     // 손가락 위쪽에 띄워서 놓일 자리 줄이 가리지 않게
  drag.target = findDrop(y);
  drag.line.style.top = drag.target.lineY + "px";
}
function endDrag(drop) {
  const d = drag; drag = null; clearInterval(scrollTick);
  d.ghost.remove(); d.line.remove(); d.el.classList.remove("dragsrc");
  suppressClick = true; setTimeout(() => suppressClick = false, 350);
  if (!drop || !d.target) return;
  const before = d.target.before;
  if (d.kind === "item") {
    const id = d.el.dataset.id;
    let section, beforeId = "";
    if (before && before.classList.contains("item")) { section = before.dataset.sec; beforeId = before.dataset.id; }
    else {
      // 프로젝트 머리 앞 = 바로 위 프로젝트의 맨 끝, 맨 위 머리 앞 = 첫 프로젝트의 맨 앞
      const heads = [...$("list").querySelectorAll(".proj")], at = before ? heads.indexOf(before) : heads.length;
      if (at > 0) section = heads[at - 1].dataset.sec;
      else { section = heads[0] ? heads[0].dataset.sec : ""; const first = $("list").querySelector(`.item[data-sec="${CSS.escape(section)}"]`); beforeId = first ? first.dataset.id : ""; }
    }
    // 제자리면 아무것도 안 한다
    const next = [...$("list").querySelectorAll(".item")].find((x, i, all) => all[i - 1] === d.el);
    const same = section === d.el.dataset.sec && (beforeId === id || (next ? beforeId === next.dataset.id && next.dataset.sec === section : !beforeId));
    if (same) return;
    push({ op: "move", id, section, before: beforeId }, section === d.el.dataset.sec ? "순서를 바꿨습니다" : "\u0027" + (section || "기타") + "\u0027(으)로 옮겼습니다");
  } else if (d.kind === "proj") {
    const name = d.el.dataset.sec, heads = [...$("list").querySelectorAll(".proj")];
    const nextHead = heads[heads.indexOf(d.el) + 1];
    if (before === nextHead || (!before && !nextHead)) return;
    push(before ? { op: "moveSection", name, before: before.dataset.sec } : { op: "moveSection", name, before: "", end: "1" }, "프로젝트 순서를 바꿨습니다");
  } else {
    const id = d.el.parentElement.dataset.steps, from = Number(d.el.dataset.stepi);
    let to = before ? Number(before.dataset.stepi) : Math.max(...[...d.el.parentElement.querySelectorAll("li[data-stepi]")].map(x => Number(x.dataset.stepi))) + 1;
    if (to > from) to--;
    if (to === from) return;
    push({ op: "moveStep", id, from, to }, "단계 순서를 바꿨습니다");
  }
}
$("list").addEventListener("pointerdown", e => {
  if (e.button > 0 || drag) return;
  const t = dragKind(e.target);
  if (!t) return;
  holdStart = { x: e.clientX, y: e.clientY };
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => beginDrag(t, holdStart.y), 420);
});
document.addEventListener("pointermove", e => {
  if (holdTimer && holdStart && Math.hypot(e.clientX - holdStart.x, e.clientY - holdStart.y) > 8) { clearTimeout(holdTimer); holdTimer = null; }
  if (drag) moveDrag(e.clientY);
});
document.addEventListener("pointerup", () => { clearTimeout(holdTimer); holdTimer = null; if (drag) endDrag(true); });
document.addEventListener("pointercancel", () => { clearTimeout(holdTimer); holdTimer = null; if (drag) endDrag(false); });
// 끄는 동안에는 화면이 같이 밀리지 않게 한다
document.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
$("list").addEventListener("contextmenu", e => { if (drag || holdTimer) e.preventDefault(); });

// ───── 누르기 ─────
$("list").addEventListener("click", e => {
  if (suppressClick) { e.preventDefault(); return; }
  const box = e.target.closest("[data-check]");
  if (box) { check(box.dataset.check); return; }
  const id = opened, item = id && view().find(x => x.id === id);
  const project = e.target.closest("[data-project]");
  if (project && project.dataset.project) {
    const from = project.dataset.project;
    ask("프로젝트 이름 바꾸기", "프로젝트 이름", v => { if (v !== from) push({ op: "rename", from, to: v.replace(/[\[\]]/g, "").trim() }, "이름을 바꿨습니다"); }, from);
    return;
  }
  const stepName = e.target.closest("[data-stepname]");
  if (stepName && item) {
    const i = Number(stepName.dataset.stepname);
    ask((i + 1) + "단계 이름 바꾸기", "단계 이름", v => push({ op: "editStep", id, step: i, text: v.replace(/→|->/g, " ") }, "단계 이름을 바꿨습니다"), item.steps[i]);
    return;
  }
  const stepDue = e.target.closest("[data-stepdue]");
  if (stepDue && item) { const i = Number(stepDue.dataset.stepdue); pickDate(item.stepDues[i], v => push({ op: "due", id, step: i, due: v }, v ? (i + 1) + "단계 마감 " + md(v) : "마감일을 지웠습니다")); return; }
  const act = e.target.closest("[data-act]");
  if (act && item) {
    const a = act.dataset.act;
    if (a === "back") push({ op: "back", id }, "'" + item.steps[item.step - 1] + "' 단계로 되돌렸습니다");
    if (a === "note") ask("메모 추가", "메모", v => push({ op: "note", id, text: v }, "메모를 넣었습니다"));
    if (a === "step") addSteps(id);
    if (a === "edit") ask("할 일 수정", "할 일", v => push({ op: "edit", id, text: v.replace(/→|->/g, " ") }, "고쳤습니다"), item.text);
    if (a === "delete" && confirm("'" + (item.steps.length > 1 ? item.text : item.text) + "' 을(를) 삭제할까요?")) { opened = null; push({ op: "delete", id }, "삭제했습니다"); }
    if (a === "due") pickDate(item.due, v => push({ op: "due", id, due: v }, v ? "마감 " + md(v) : "마감일을 지웠습니다"));
    return;
  }
  const body = e.target.closest("[data-open]");
  if (body) { opened = opened === body.dataset.open ? null : body.dataset.open; render(); }
});
$("sheet").addEventListener("click", e => {
  if (e.target.closest("[data-close]")) { closeSheet(); return; }
  const p = e.target.closest("[data-phrase]");
  if (p) usePhrase(((state && state.phrases) || [])[Number(p.dataset.phrase)]);
});
$("shade").addEventListener("click", e => { if (e.target === $("shade")) closeSheet(); });
document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.filter;
  document.querySelectorAll("[data-filter]").forEach(x => x.classList.toggle("on", x === b));
  render();
}));
$("phrases").addEventListener("click", showPhrases);
$("search").addEventListener("click", () => { $("findBar").hidden = false; $("findText").focus(); });
$("findText").addEventListener("input", () => { query = $("findText").value.trim(); render(); });
$("findText").addEventListener("keydown", e => { if (e.key === "Enter") $("findText").blur(); });
$("findClose").addEventListener("click", () => { $("findText").value = ""; query = ""; $("findBar").hidden = true; render(); });
$("settings").addEventListener("click", showSettings);
applyLook();
$("add").addEventListener("click", add);
$("newText").addEventListener("keydown", e => { if (e.key === "Enter") add(); });
$("newSection").addEventListener("change", () => picked = true);
$("connect").addEventListener("click", connect);
$("undo").addEventListener("click", () => {
  if (!lastOp) return;
  inbox = inbox.filter(op => op.key !== lastOp.key); save("inbox", inbox);
  $("toast").hidden = true; render(); send();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
// 화면을 보고 있는 동안에는 알아서 맞춘다.
setInterval(() => { if (!demo && token && !document.hidden) refresh(); }, 20000);
if (!demo && !native()) { const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client"; s.async = true; document.head.appendChild(s); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
refresh();
</script>
